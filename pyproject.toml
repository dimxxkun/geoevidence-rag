[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "geoevidence-rag"
version = "0.1.0"
description = "Spatially constrained hybrid retrieval and local, evidence-linked question answering"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "LicenseRef-Noncommercial-Commercial-Permission-1.0"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.1,<3", "pyproj>=3.7,<4", "pydantic>=2.10,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
neural = ["sentence-transformers>=3.4,<6", "transformers>=4.48,<5", "torch>=2.6,<3", "sentencepiece>=0.2,<1"]
demo = ["streamlit>=1.42,<2", "pydeck>=0.9,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[project.scripts]
geoevidence = "geoevidence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geoevidence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
